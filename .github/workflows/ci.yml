name: CI
on: [push, pull_request]
jobs:
  rust:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - run: cargo fmt --manifest-path rust/quietnight-core/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/quietnight-core/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/quietnight-core/Cargo.toml

  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned simulator app
        run: >-
          xcodebuild
          -project QuietNight.xcodeproj
          -scheme QuietNight
          -sdk iphonesimulator
          -configuration Debug
          CODE_SIGNING_ALLOWED=NO
          build
