name: QuietNight
options:
  bundleIdPrefix: com.jrosecode
targets:
  QuietNight:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [ios/QuietNight]
    info: { path: ios/QuietNight/Info.plist }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jrosecode.quietnight
        PRODUCT_NAME: QuietNight
        SWIFT_VERSION: 5.9
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
